rules:
  - id: pbp.python.subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: Avoid shell=True with subprocess; pass an argument list and validate untrusted values.
    metadata:
      category: security
      confidence: MEDIUM
      impact: Shell invocation can enable command injection when command data is externally controlled.
      fix: Trace command data; replace the shell string with an argument list, or document why a constant trusted command requires a shell.
      technology: [python]
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: pbp.python.requests-without-timeout
    languages: [python]
    severity: WARNING
    message: Set an explicit timeout for outbound HTTP requests.
    metadata:
      category: security
      confidence: MEDIUM
      impact: An outbound call without a deadline can exhaust workers or hang request processing.
      fix: Set an explicit connect/read timeout appropriate to the operation.
      technology: [python]
    patterns:
      - pattern: requests.$METHOD(...)
      - pattern-not: requests.$METHOD(..., timeout=$TIMEOUT, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|request)$

  - id: pbp.python.generic-exception-swallowed
    languages: [python]
    severity: WARNING
    message: A broad exception is swallowed without preserving diagnostic context.
    metadata:
      category: maintainability
      confidence: MEDIUM
      impact: Distinct operational and programming failures become indistinguishable and lose diagnostic context.
      fix: Catch only expected exceptions at the appropriate boundary and preserve actionable error context.
      technology: [python]
    patterns:
      - pattern-either:
          - pattern: |
              try:
                ...
              except Exception:
                pass
          - pattern: |
              try:
                ...
              except Exception:
                return None

  - id: pbp.javascript.child-process-exec
    languages: [javascript, typescript]
    severity: WARNING
    message: child_process.exec invokes a shell; avoid passing untrusted or constructed commands.
    metadata:
      category: security
      confidence: MEDIUM
      impact: Shell execution can enable command injection when command data is externally controlled.
      fix: Prefer execFile/spawn with an argument list and validate any externally controlled values.
      technology: [javascript, typescript]
    # `$CP.exec(...)` a secas casaba con CUALQUIER `.exec()`, y en JavaScript el
    # `.exec()` mas comun con diferencia es el de las expresiones regulares
    # (`/re/.exec(texto)`), que no tiene nada que ver con ejecutar un shell.
    # Sobre audit_code producia 6 hallazgos y los 6 eran regex. Una regla de
    # seguridad que acusa a codigo inocente se acaba silenciando entera, y con
    # ella el dia que aparezca la llamada de verdad.
    #
    # Ahora el receptor tiene que parecer el modulo child_process.
    patterns:
      - pattern-either:
          - pattern: $CP.exec(...)
          - pattern: require("child_process").exec(...)
          - pattern: require('child_process').exec(...)
      - metavariable-regex:
          metavariable: $CP
          regex: ^(child_process|childProcess|child|cp|node:child_process)$
  - id: pbp.python.regex-compile-in-loop
    languages: [python]
    severity: INFO
    message: A constant regular expression is compiled on every iteration.
    metadata:
      category: performance
      confidence: MEDIUM
      impact: Re-compiling a constant pattern each pass repeats work that could be done once; the `re` module caches only a bounded number of patterns.
      fix: Hoist `re.compile(...)` out of the loop (module level or before the loop) and reuse the compiled pattern.
      technology: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                ...
          - pattern-inside: |
              while $C:
                ...
      - pattern: re.compile("...")

  - id: pbp.python.query-in-loop
    languages: [python]
    severity: INFO
    message: A database statement is executed once per iteration (possible N+1 query pattern).
    metadata:
      category: performance
      confidence: LOW
      impact: One round trip per item scales linearly with the data and usually dominates the latency of the loop.
      fix: Fetch all the needed rows with one query (`WHERE id IN (...)`, a JOIN) or batch the writes with `executemany`; leave it as is if the loop is intentionally sequential.
      technology: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                ...
          - pattern-inside: |
              while $C:
                ...
      - pattern: $CUR.execute(...)
      - metavariable-regex:
          metavariable: $CUR
          regex: (?i)^(cur|cursor|c|conn|connection|db|session|self\.cursor|self\.conn|self\.db)$

  - id: pbp.python.read-whole-file-lines
    languages: [python]
    severity: INFO
    message: The whole file is loaded into memory as a list of lines.
    metadata:
      category: performance
      confidence: LOW
      impact: Memory grows with the file size; for large inputs this can exhaust memory when the lines are only consumed once.
      fix: Iterate the file object directly (`for line in f:`) when each line is processed once and the whole list is not needed.
      technology: [python]
    pattern-either:
      - pattern: open(...).readlines()
      - patterns:
          - pattern: $F.readlines()
          - metavariable-regex:
              metavariable: $F
              regex: ^(f|fh|fp|file|infile|in_file|handle|archivo|fichero)$
